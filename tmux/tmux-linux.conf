# Merged tmux config for the Linux server profile (tmux >= 3.x).
# Linked to ~/.config/tmux/tmux.conf by setup/steps/40-tmux.sh; a leftover
# ~/.tmux.conf is moved aside, because tmux reads it first and this file wins.

# Terminal and colors
set -s default-terminal "xterm-256color"
set-option -sa terminal-overrides ",xterm-256color:clipboard:RGB"
set -s set-clipboard on
set -g mouse on
set-option -g default-shell /bin/zsh

# Responsiveness and history
set -s escape-time 0
set -g history-limit 50000
set -sg repeat-time 300
set -g focus-events on
setw -g aggressive-resize on

# Prefix
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Remap
bind C-p previous-window
bind C-n next-window
bind C-f run-shell "tmux neww tmux-sessionizer"

# Pane
bind v split-window -v -l 15
bind b split-window -h -l 50
bind V split-window -v
bind B split-window -h

# Windows
bind C-k switch -t Work
bind C-j switch -t Code
bind C-m switch -t Me

# Move windows left/right
bind -r Left swap-window -d -t -1
bind -r Right swap-window -d -t +1

# vim-like pane switching
bind k select-pane -U
bind j select-pane -D
bind h select-pane -L
bind l select-pane -R

# vi mode and copy-mode keys
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Machine-local bindings and overrides live in this file (not in the repo)
source-file -q ~/.config/tmux/local.conf

# Plugins (pinned checkouts are installed by the bootstrap, not by tpm)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin "nordtheme/tmux"
set -g @nord_tmux_show_status_content "1"
set -g @nord_tmux_no_patched_font "1"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
